<div class="col-md-6">
{% if campo.field.widget.input_type == 'checkbox' %}
<div class="form-check mt-4">{{ campo }}<label class="form-check-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label></div>
{% else %}
<label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}
{% endif %}
{% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
{% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
</div>
