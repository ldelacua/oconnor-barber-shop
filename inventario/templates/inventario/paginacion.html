{% if pagina.paginator.num_pages > 1 %}
<nav class="d-flex gap-3 align-items-center mt-3" aria-label="Paginación">
{% if pagina.has_previous %}<a class="btn btn-outline-secondary" href="?{{ query }}&page={{ pagina.previous_page_number }}">Anterior</a>{% endif %}
<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>
{% if pagina.has_next %}<a class="btn btn-outline-secondary" href="?{{ query }}&page={{ pagina.next_page_number }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
