{% extends "base.html" %}

{% block title %}Eliminar servicio{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
            <h2 class="mb-0">Eliminar servicio</h2>
        </div>

        <div class="card-body">
            <p>
                ¿Estás seguro de que deseas eliminar el servicio
                <strong>{{ servicio.nombre }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sí, eliminar
                </button>

                <a href="{% url 'servicios:lista' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>

</div>
{% endblock %}
