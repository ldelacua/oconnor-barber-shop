{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | O'Connor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/login.css' %}"
    >
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <div class="brand-icon">
                <i class="bi bi-scissors"></i>
            </div>

            <h1>O'Connor</h1>
            <p>Barber Shop Management</p>
        </div>

        <div class="login-content">

            <h2>Bienvenido</h2>
            <p class="login-subtitle">
                Ingresa tus credenciales para acceder al sistema.
            </p>

            {% if form.non_field_errors %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">

                    <label for="{{ form.username.id_for_label }}" class="form-label">
                        Usuario
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            name="{{ form.username.html_name }}"
                            id="{{ form.username.id_for_label }}"
                            class="form-control"
                            value="{{ form.username.value|default:'' }}"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                </div>

                <div class="mb-4">

                    <label for="{{ form.password.id_for_label }}" class="form-label">
                        Contraseña
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            name="{{ form.password.html_name }}"
                            id="{{ form.password.id_for_label }}"
                            class="form-control"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="mostrarContrasena"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="bi bi-eye" id="iconoContrasena"></i>
                        </button>
                    </div>

                </div>

                <button type="submit" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Iniciar sesión
                </button>

            </form>

        </div>

        <div class="login-footer">
            <small>
                © {% now "Y" %} O'Connor Barber Shop
            </small>
        </div>

    </div>

</div>

<script>
    const botonContrasena = document.getElementById("mostrarContrasena");
    const campoContrasena = document.getElementById(
        "{{ form.password.id_for_label }}"
    );
    const iconoContrasena = document.getElementById("iconoContrasena");

    botonContrasena.addEventListener("click", function () {
        const mostrar = campoContrasena.type === "password";

        campoContrasena.type = mostrar ? "text" : "password";

        iconoContrasena.classList.toggle("bi-eye", !mostrar);
        iconoContrasena.classList.toggle("bi-eye-slash", mostrar);

        botonContrasena.setAttribute(
            "aria-label",
            mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
        );
    });
</script>

</body>
</html>
