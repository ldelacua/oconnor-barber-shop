{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="d-flex justify-content-between mb-4"><h2>{% if tipo == 'porcentajes' %}Porcentaje de venta del producto{% else %}Tramo de descuento{% endif %}</h2><a class="btn btn-outline-secondary" href="{{ regresar }}">Regresar</a></div>
<form method="post" class="card card-body">{% csrf_token %}<input type="hidden" name="next" value="{{ regresar }}">{{ form.as_p }}
<div><button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" href="{{ regresar }}">Regresar</a></div></form>
{% endblock %}
{% block extra_js %}<script src="{% static 'inventario/buscador_productos.js' %}?v=7"></script>{% endblock %}
